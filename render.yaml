services:
  - type: web
    name: lamlibaas-api
    runtime: python
    buildCommand: pip install -r requirements.txt && mkdir -p staticfiles && python manage.py collectstatic --noinput --clear
    startCommand: python manage.py migrate --noinput && gunicorn lamlibaas_api.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ENABLED_PAYMENT_METHODS
        value: "jazzcash,easypaisa,bank_transfer"
      - key: DATABASE_URL
        fromDatabase:
          name: lamlibaas-db
          property: connectionString

databases:
  - name: lamlibaas-db
    databaseName: lamlibaas
    plan: free
